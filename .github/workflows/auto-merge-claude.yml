name: Auto-merge Claude branches

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --json number -q '.[0].number' || echo "")

          if [ -z "$EXISTING_PR" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --title "Auto-merge: ${BRANCH_NAME}" \
              --body "Automated merge from Claude Code session." \
              --base main \
              --head "$BRANCH_NAME"
          fi

          gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
