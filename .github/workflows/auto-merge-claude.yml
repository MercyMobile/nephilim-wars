name: Auto-merge Claude branches

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get branch name
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number' || echo "")

          if [ -z "$EXISTING_PR" ]; then
            # Create PR
            gh pr create \
              --title "Auto-merge: ${BRANCH_NAME}" \
              --body "Automated merge from Claude Code session." \
              --base main \
              --head "$BRANCH_NAME"
          fi

          # Merge the PR
          gh pr merge "$BRANCH_NAME" --squash --delete-branch
