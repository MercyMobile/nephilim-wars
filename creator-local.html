<html lang="en">
<head>

    <style>
        :root {
            --bg-dark: #050508;
            --bg-panel: #0f0f16;
            --gold-primary: #d4af37;
            --gold-dim: #8a7018;
            --gold-bright: #f9e29c;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-red: #451a03;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            font-family: 'Crimson Pro', serif;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- UTILITIES & LAYOUT --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }

        h1, h2, h3, label, button, select, input, textarea, .stat-label { 
            font-family: 'Cinzel', serif; 
        }

        /* --- PANEL STYLING --- */
        .panel {
            background: rgba(15, 15, 22, 0.95);
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Decorative Corners */
        .corner-tl, .corner-br { position: absolute; width: 20px; height: 20px; border-color: var(--gold-primary); pointer-events: none; }
        .corner-tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

        /* --- TYPOGRAPHY --- */
        .title-gradient {
            background: linear-gradient(180deg, var(--gold-bright), var(--gold-primary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            font-size: 2rem; font-weight: 700; text-align: center;
            border-bottom: 1px solid var(--gold-dim); padding-bottom: 15px; margin-bottom: 25px;
        }

        .section-header {
            color: var(--gold-primary); font-size: 1.1rem;
            margin: 20px 0 10px 0; border-bottom: 1px dashed #444; padding-bottom: 5px;
        }

        /* --- FORMS --- */
        .input-group { margin-bottom: 15px; }
        
        label {
            display: block; font-size: 0.75rem; color: var(--gold-dim);
            text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%; padding: 12px;
            background: #0a0a0f; border: 1px solid #333;
            color: var(--text-main); font-size: 0.95rem; font-family: 'Crimson Pro', serif;
            transition: border 0.3s;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold-primary); }
        
        textarea { resize: vertical; min-height: 80px; }

        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* Height Input Group */
        .height-group { display: flex; gap: 10px; }
        .btn-mini { 
            padding: 0 15px; background: #1a1a25; border: 1px solid #333; color: var(--text-muted); cursor: pointer; 
        }
        .btn-mini:hover { color: var(--gold-primary); border-color: var(--gold-dim); }

        /* Info Box */
        .info-box {
            background: rgba(0,0,0,0.3); border-left: 3px solid var(--gold-dim);
            padding: 15px; margin-top: 10px; font-size: 0.9rem;
        }
        .tag {
            display: inline-block; background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-dim); padding: 2px 8px; margin: 2px;
            font-size: 0.75rem; color: var(--gold-bright);
        }

        /* --- STATS INPUTS --- */
        .stats-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; background: rgba(255,255,255,0.03); padding: 10px; border: 1px solid #333; }
        .stat-col { text-align: center; }
        .stat-col select { padding: 4px; font-size: 0.85rem; text-align: center; }

        /* --- BUTTONS --- */
        .btn-forge {
            width: 100%; padding: 18px; margin-top: 30px;
            background: linear-gradient(135deg, var(--gold-dim), var(--accent-red));
            border: 1px solid var(--gold-bright); color: #fff;
            font-size: 1.1rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.3s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .btn-forge:hover { box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); border-color: #fff; }
        .btn-forge:disabled { opacity: 0.5; cursor: wait; filter: grayscale(100%); }

        /* --- CHARACTER SHEET (RIGHT COL) --- */
        .sheet-container {
            background: #0a0a0f; border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: sticky; top: 20px;
        }

        .sheet-header {
            background: #14141d; padding: 20px; text-align: center;
            border-bottom: 2px solid var(--gold-dim);
        }
        .char-name { font-size: 2rem; color: var(--gold-primary); font-weight: 700; letter-spacing: 2px; line-height: 1.1; }
        .char-sub { color: var(--text-muted); font-style: italic; font-size: 0.9rem; margin-top: 5px; }

        .portrait-frame {
            width: 100%; aspect-ratio: 4/3; 
            background: #000; position: relative; overflow: hidden;
            border-bottom: 2px solid var(--gold-dim);
        }
        
        #char-image { width: 100%; height: 100%; object-fit: contain; transition: opacity 0.5s; }
        
        .loader {
            position: absolute; inset: 0; background: #050508;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--gold-dim);
            border-top-color: transparent; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .sheet-body { padding: 25px; }

        /* Hex Stats Display */
        .hex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .hex-stat {
            background: rgba(255,255,255,0.03); border: 1px solid #333;
            padding: 10px; text-align: center; position: relative;
        }
        .hex-val { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .hex-lbl { font-size: 0.6rem; color: var(--gold-dim); letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; font-family: 'Cinzel'; }
        .hex-mod {
            position: absolute; top: -8px; right: -5px;
            background: #1a1a25; border: 1px solid var(--gold-bright);
            font-size: 0.75rem; padding: 1px 5px; color: var(--gold-bright);
            border-radius: 3px; font-family: monospace;
        }

        .trait-list { margin-top: 20px; font-size: 0.9rem; }
        .trait-row { 
            padding: 8px 0; border-bottom: 1px dashed #333;
            display: flex; flex-direction: column;
        }
        .trait-row:last-child { border-bottom: none; }
        .t-name { color: var(--gold-primary); font-weight: 700; }
        .t-desc { color: #ccc; font-size: 0.85rem; margin-top: 2px; }

    </style>
</head>

        populateSelect('eyes', APPEARANCE_DATA.eyes);
        populateSelect('hair-color', APPEARANCE_DATA.hairColors);
        populateSelect('hair-len', APPEARANCE_DATA.hairLengths);
        populateSelect('feature', APPEARANCE_DATA.features);
        populateSelect('background', APPEARANCE_DATA.backgrounds);
        populateSelect('vibe', APPEARANCE_DATA.vibes);

        // 4. Populate Stats Dropdowns
        document.querySelectorAll('.stat-select').forEach(sel => {
            sel.innerHTML = '';
            for(let i=18; i>=3; i--) {
                let opt = document.createElement('option');
                opt.value = i; opt.innerText = i;
                if(i===10) opt.selected = true;
                sel.appendChild(opt);
            }
        });
    }

    function populateSelect(id, options) {
        const sel = document.getElementById(id);
        if(!sel) return;
        sel.innerHTML = ''; // Clear hardcoded HTML
        options.forEach(optText => {
            let opt = document.createElement('option');
            // Check if option has a modifier in parens for value splitting
            opt.value = optText.split('(')[0].trim(); 
            opt.innerText = optText;
            sel.appendChild(opt);
        });
    }

    function updateRaceInfo() {
        const raceKey = document.getElementById('race').value;
        const data = RACES[raceKey];
        const infoBox = document.getElementById('race-info');
        
        let statTags = Object.entries(data.stats).map(([s,v]) => 
            `<span class="tag">${s.toUpperCase()} ${v>0?'+':''}${v}</span>`
        ).join('');
        
        let traitTags = data.traits.map(t => {
            let shortName = t.split('(')[0].trim();
            return `<span class="tag">${shortName}</span>`
        }).join('');

        infoBox.innerHTML = `
            <div style="color:var(--gold-bright); font-weight:bold; margin-bottom:5px;">${data.name}</div>
            <div style="margin-bottom:8px;">${data.desc}</div>
            <div>${statTags}${traitTags}</div>
        `;
    }

    function calculateMod(score) {
        const mod = Math.floor((score - 10) / 2);
        return mod >= 0 ? `+${mod}` : mod;
    }

    // --- RANDOMIZATION LOGIC (CHAOS MODE) ---

    function rollDice(num, sides) {
        let total = 0;
        for(let i=0; i<num; i++) total += Math.floor(Math.random() * sides) + 1;
        return total;
    }

    function rollStat4d6() {
        let rolls = [];
        for(let i=0; i<4; i++) rolls.push(Math.floor(Math.random() * 6) + 1);
        rolls.sort((a,b) => a-b).shift(); // Drop lowest
        return rolls.reduce((a,b) => a+b, 0);
    }

    function randomSelect(id) {
        const sel = document.getElementById(id);
        const options = sel.options;
        const randIndex = Math.floor(Math.random() * options.length);
        sel.selectedIndex = randIndex;
    }

    function rollHeight() {
        const race = document.getElementById('race').value;
        let baseFeet = 5, baseInches = 9;
        
        if (['Nephilim', 'Anakim', 'Rephaim'].includes(race)) {
            baseFeet = 9 + Math.floor(Math.random() * 6); 
        } else if (race === 'Gibborim') {
            baseFeet = 6; 
            baseInches = 6 + Math.floor(Math.random() * 6);
        } else {
            baseFeet = 5;
            baseInches = Math.floor(Math.random() * 12);
        }
        document.getElementById('height').value = `${baseFeet}'${baseInches}"`;
    }

    function summonRandomLegend() {
        // Randomize Dropdowns
        const selects = ['race', 'class', 'sex', 'skin', 'eyes', 'hair-color', 'hair-len', 'feature', 'background', 'vibe'];
        selects.forEach(id => randomSelect(id));

        // Trigger updates
        updateRaceInfo();
        rollHeight();

        // Randomize Stats (4d6 drop lowest)
        const stats = ['str','dex','con','int','wis','cha'];
        stats.forEach(s => {
            document.getElementById(`base-${s}`).value = rollStat4d6();
        });

        // Random Name
        const raceKey = document.getElementById('race').value;
        const sex = document.getElementById('sex').value;
        let list = (['Nephilim','Anakim'].includes(raceKey)) ? NAMES.Nephilim : NAMES[sex];
        document.getElementById('custom-name').value = list[Math.floor(Math.random() * list.length)];

        // Random Mount/Extra (20% chance) OR if Class is Hunter/Wanderer
        const cls = document.getElementById('class').value;
        const roll = Math.random();
        if (roll > 0.7 || cls === 'Hunter' || cls === 'Warrior') {
            const mount = APPEARANCE_DATA.mounts[Math.floor(Math.random() * APPEARANCE_DATA.mounts.length)];
            document.getElementById('custom-desc').value = mount + ", wearing bronze age armor.";
        } else {
            document.getElementById('custom-desc').value = "";
        }

        // Auto-Generate (Optional: Uncomment next line to instant-generate)
        // generateCharacter();
    }

    // --- GENERATION LOGIC ---

    async function generateCharacter() {
        const btn = document.getElementById('gen-btn');
        const chaosBtn = document.getElementById('chaos-btn');
        const loader = document.getElementById('loader');
        const img = document.getElementById('char-image');
        
        btn.disabled = true; 
        if(chaosBtn) chaosBtn.disabled = true;
        loader.style.display = 'flex';
        
        // --- DATA GATHERING ---
        const raceKey = document.getElementById('race').value;
        const raceData = RACES[raceKey];
        const cls = document.getElementById('class').value;
        const sex = document.getElementById('sex').value;
        const bg = document.getElementById('background').value;
        const vibe = document.getElementById('vibe').value;
        
        const rawHeight = document.getElementById('height').value;
        const skin = document.getElementById('skin').value;
        const eyes = document.getElementById('eyes').value;
        const hairCol = document.getElementById('hair-color').value;
        const hairLen = document.getElementById('hair-len').value;
        const feature = document.getElementById('feature').value;
        const custom = document.getElementById('custom-desc').value;

        // Name Logic
        let name = document.getElementById('custom-name').value;
        if(!name) {
            let list = (['Nephilim','Anakim'].includes(raceKey)) ? NAMES.Nephilim : NAMES[sex];
            name = list[Math.floor(Math.random() * list.length)];
        }

        // Stats UI Update
        const stats = ['str','dex','con','int','wis','cha'];
        stats.forEach(s => {
            let val = parseInt(document.getElementById(`base-${s}`).value);
            if(raceData.stats[s]) val += raceData.stats[s];
            document.getElementById(`val-${s}`).innerText = val;
            document.getElementById(`mod-${s}`).innerText = calculateMod(val);
        });

        // Traits UI Update
        const tList = document.getElementById('traits-list');
        tList.innerHTML = raceData.traits.map(t => {
            let [tName, tDesc] = t.split('(');
            tDesc = tDesc ? tDesc.replace(')', '') : '';
            return `<div class="trait-row"><span class="t-name">${tName}</span><span class="t-desc">${tDesc}</span></div>`;
        }).join('');

        document.getElementById('sheet-name').innerText = name;
        document.getElementById('sheet-sub').innerText = `${sex} ${raceKey} ${cls}`;

        // --- SAFE PROMPT CONSTRUCTION (THE FIX) ---
        
// 1. Get Body Type & Sanitize Height
        let bodyType = document.getElementById('bodyType') ? document.getElementById('bodyType').value : 'random'; 
        if (bodyType === 'random') {
            const types = ['gaunt', 'wiry', 'muscular', 'broad-shouldered', 'heavyset', 'stocky'];
            bodyType = types[Math.floor(Math.random() * types.length)];
        }
        let safeHeight = rawHeight.replace(/'/g, "ft ").replace(/"/g, "in").trim();

        // 2. Phenotype & Texture Logic
        let phenotype = "";
        let hairTexture = "";
        const raceCheck = raceKey.toLowerCase(); 
        const skinCheck = document.getElementById('skin').value.toLowerCase();
        
        // SKIN FIX: Global mapping to prevent "Clown Face"
        // We use "Mediterranean" instead of "Olive" because SD renders "Olive" as dark green/bronze.
        // "Mediterranean" gets that lighter, sun-kissed look you are aiming for.
        let cleanSkin = document.getElementById('skin').value.split('(')[0].trim();
        if(cleanSkin === "Olive") cleanSkin = "Mediterranean skin tone"; 
        if(cleanSkin === "Bronze") cleanSkin = "Golden sun-tanned skin"; 

        // HAIR FIX: Map "Short Cropped" to "Short curly"
        let cleanHairLen = document.getElementById('hair-len').value;
        if(cleanHairLen === "Short Cropped") cleanHairLen = "Military short curly"; 

        // BUCKET A: GIANTS
        if (raceCheck.includes("giant") || raceCheck.includes("nephilim") || raceCheck.includes("anakim") || raceCheck.includes("rephaim") || raceCheck.includes("gibborim")) {
            phenotype = "towering height, unnatural muscular definition, rigid facial structure, ancient brutalism";
            hairTexture = "thick straggly";
        } 
        // BUCKET B: AFRICAN / NUBIAN
        else if (skinCheck.includes("nubian") || skinCheck.includes("dark brown")) {
            phenotype = "Nubian features, Sub-Saharan, Ancient Kushite royal";
            hairTexture = "coarse"; 
        } 
        // BUCKET C: HEBREW / SEMITIC (Default)
        else {
            // FIX: Removed "fair complexion" from here so it doesn't just stick to the face.
            // We rely entirely on the 'cleanSkin' variable above to set the color.
            phenotype = "Ancient Levantine facial features, aquiline nose, historical biblical era";
            hairTexture = "thick wavy"; 
        }

        // 3. Assemble Prompt
        let featureText = feature !== 'None' ? `, with ${feature}` : '';
        
        // PROMPT STRUCTURE:
        // We put skin FIRST and separated from face logic.
        // ex: "Mediterranean skin tone, Ancient Levantine facial features..."
        let appearance = `${cleanSkin}, ${phenotype}, ${bodyType} build, ${eyes} eyes, ${cleanHairLen} ${hairCol} ${hairTexture} hair${featureText}`;
        
        if(custom) appearance += `, ${custom}`;

        let rawPrompt = `wide angle full body cinematic shot of a ${sex} ${raceKey} ${cls}, ${appearance}, wearing ${raceData.visuals}, ${safeHeight} tall, standing in ${bg}, ${vibe} atmosphere, detailed fantasy art, dramatic lighting, 8k, oil painting style, masterpiece, wide view, detailed background`;
        
        // 4. Negative Prompt (Disabled)
        // if (!skinCheck.includes("nubian")) { ... }        
		const cleanPrompt = rawPrompt.replace(/[()"]/g, "");

        console.log("Sending Sanitized Prompt:", cleanPrompt);

        try {
            const response = await fetch(`${API_URL}/generate-image`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: cleanPrompt,
                    ...SYSTEM_CONFIG
                })
            });

            if(!response.ok) throw new Error("API Error");
            const data = await response.json();
            
            if(data.image) img.src = `data:image/png;base64,${data.image}`;

        } catch(e) {
            console.error("Generation Failed:", e);
        } finally {
            btn.disabled = false; 
            if(chaosBtn) chaosBtn.disabled = false;
            loader.style.display = 'none';
        }
    }
    
    window.onload = populateUI;
</script>
</body>
</html>
