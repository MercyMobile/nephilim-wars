<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nephilim Wars - Dice Roller</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Cinzel', serif; }

        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* --- NAVIGATION BUTTON --- */
        .nav-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 25px;
            border-radius: 8px;
            background: rgba(28, 25, 23, 0.9); 
            border: 2px solid #b45309;
            color: #fcd34d; 
            text-decoration: none; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .nav-button:hover {
            background: linear-gradient(135deg, #78350f 0%, #451a03 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
            color: #fff;
        }

        /* --- UI PANEL --- */
        .controls {
            position: fixed; top: 20px; right: 20px; z-index: 100; width: 280px; padding: 25px;
            border-radius: 12px; background: rgba(28, 25, 23, 0.9); border: 2px solid #b45309;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px); color: #d6d3d1;
        }

        .title {
            color: #fcd34d; font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 1px solid #78350f; padding-bottom: 10px;
        }

        .control-group { margin-bottom: 15px; }

        label {
            display: block; color: #f59e0b; font-size: 12px; font-weight: 600;
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
        }

        select, input {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #78350f;
            background: #0c0a09; color: #e7e5e4; font-family: 'Cinzel', serif; font-size: 14px; transition: all 0.3s;
        }
        select:focus, input:focus { outline: none; border-color: #fcd34d; box-shadow: 0 0 10px rgba(180, 83, 9, 0.3); }

        button {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #f59e0b;
            background: linear-gradient(135deg, #78350f 0%, #451a03 100%); color: #fcd34d;
            font-size: 16px; font-family: 'Cinzel', serif; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        button:hover {
            background: linear-gradient(135deg, #92400e 0%, #78350f 100%); transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        button:active { transform: translateY(0); }

        #result-display {
            margin-top: 20px; padding: 15px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid #78350f; border-radius: 8px; text-align: center;
            min-height: 80px; display: flex; flex-direction: column; justify-content: center;
        }
        .result-total {
            font-size: 42px; font-weight: bold; color: #fcd34d; text-shadow: 0 0 20px rgba(180, 83, 9, 0.5); margin-bottom: 5px;
        }
        .result-details { font-size: 14px; color: #a8a29e; font-family: sans-serif; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, #78350f, transparent); margin: 20px 0; }
        .rolling-indicator { color: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    
    
<a href="../index.html" class="nav-button">
    🏠 Home Hub
</a>
    <div id="canvas-container"></div>

    <div class="controls">
        <div class="title">⚔️ NEPHILIM WARS ⚔️</div>
        
        <div class="control-group">
            <label>🎨 Damage Type</label>
            <select id="theme-selector"></select>
        </div>

        <div class="control-group">
            <label>🎲 Number of Dice</label>
            <input type="number" id="dice-count" value="1" min="1" max="10">
        </div>

        <div class="control-group">
            <label>📊 Die Type</label>
            <select id="dice-type">
                <option value="4">d4 (Pyramid)</option>
                <option value="6">d6 (Cube)</option>
                <option value="8">d8 (Octahedron)</option>
                <option value="10">d10 (Decahedron)</option>
                <option value="12">d12 (Dodecahedron)</option>
                <option value="20" selected>d20 (Icosahedron)</option>
            </select>
        </div>

        <div class="divider"></div>
        <button onclick="rollDice()">🎲 ROLL DICE</button>
        <div id="result-display"><div style="color: #666; font-size: 14px;">Ready to roll!</div></div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        // ============================================================================
        // ENHANCED THEME DEFINITIONS WITH PBR MATERIAL PROPERTIES
        // ============================================================================
        const THEMES = {
            fire: {
                label: '🔥 Fire',
                key: 'fire',
                material: {
                    baseColor: 0xFF3300,
                    metalness: 0.4,
                    roughness: 0.3,
                    emissive: 0xFF4400,
                    emissiveIntensity: 1.2,
                    clearcoat: 0.5,
                    clearcoatRoughness: 0.15,
                }
            },
            ice: {
                label: '❄️ Ice',
                key: 'ice',
                material: {
                    baseColor: 0x88CCFF,
                    metalness: 0.0,
                    roughness: 0.02,
                    emissive: 0x4080FF,
                    emissiveIntensity: 0.8,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.0,
                    transmission: 0.6,
                    thickness: 0.8,
                }
            },
            necrotic: {
                label: '💀 Necrotic',
                key: 'necrotic',
                material: {
                    baseColor: 0x1A1A1A,
                    metalness: 0.1,
                    roughness: 0.7,
                    emissive: 0x4A0060,
                    emissiveIntensity: 1.0,
                    clearcoat: 0.2,
                    clearcoatRoughness: 0.5,
                }
            },
            radiant: {
                label: '✨ Radiant',
                key: 'radiant',
                material: {
                    baseColor: 0xFFCC00,
                    metalness: 0.8,
                    roughness: 0.1,
                    emissive: 0xFFDD00,
                    emissiveIntensity: 1.5,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.05,
                }
            },
            acid: {
                label: '🧪 Acid',
                key: 'acid',
                material: {
                    baseColor: 0x44FF00,
                    metalness: 0.15,
                    roughness: 0.35,
                    emissive: 0x66FF00,
                    emissiveIntensity: 1.0,
                    clearcoat: 0.8,
                    clearcoatRoughness: 0.1,
                }
            },
            lightning: {
                label: '⚡ Lightning',
                key: 'lightning',
                material: {
                    baseColor: 0x0099FF,
                    metalness: 0.6,
                    roughness: 0.15,
                    emissive: 0x00CCFF,
                    emissiveIntensity: 1.3,
                    clearcoat: 0.9,
                    clearcoatRoughness: 0.08,
                }
            },
            force: {
                label: '🌀 Force',
                key: 'force',
                material: {
                    baseColor: 0x9900DD,
                    metalness: 0.5,
                    roughness: 0.2,
                    emissive: 0xBB44FF,
                    emissiveIntensity: 1.1,
                    clearcoat: 0.8,
                    clearcoatRoughness: 0.1,
                }
            },
            psychic: {
                label: '🧠 Psychic',
                key: 'psychic',
                material: {
                    baseColor: 0xFF0080,
                    metalness: 0.35,
                    roughness: 0.25,
                    emissive: 0xFF44AA,
                    emissiveIntensity: 1.2,
                    clearcoat: 0.7,
                    clearcoatRoughness: 0.15,
                }
            },
            nature: {
                label: '🌿 Nature',
                key: 'nature',
                material: {
                    baseColor: 0x00AA22,
                    metalness: 0.1,
                    roughness: 0.45,
                    emissive: 0x22CC44,
                    emissiveIntensity: 0.8,
                    clearcoat: 0.5,
                    clearcoatRoughness: 0.25,
                }
            },
            thunder: {
                label: '⛈️ Thunder',
                key: 'thunder',
                material: {
                    baseColor: 0x555570,
                    metalness: 0.7,
                    roughness: 0.25,
                    emissive: 0x8080AA,
                    emissiveIntensity: 0.9,
                    clearcoat: 0.6,
                    clearcoatRoughness: 0.2,
                }
            },
            holy: {
                label: '🙏 Holy',
                key: 'holy',
                material: {
                    baseColor: 0xFFEE88,
                    metalness: 0.5,
                    roughness: 0.15,
                    emissive: 0xFFFFAA,
                    emissiveIntensity: 1.4,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.05,
                }
            },
            shadow: {
                label: '🌑 Shadow',
                key: 'shadow',
                material: {
                    baseColor: 0x220044,
                    metalness: 0.25,
                    roughness: 0.4,
                    emissive: 0x6600AA,
                    emissiveIntensity: 1.0,
                    clearcoat: 0.4,
                    clearcoatRoughness: 0.3,
                }
            },
            blood: {
                label: '🩸 Blood',
                key: 'blood',
                material: {
                    baseColor: 0x660000,
                    metalness: 0.1,
                    roughness: 0.5,
                    emissive: 0xCC0020,
                    emissiveIntensity: 1.1,
                    clearcoat: 0.85,
                    clearcoatRoughness: 0.2,
                }
            },
        };

        const selector = document.getElementById('theme-selector');
        for (const [key, theme] of Object.entries(THEMES)) {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = theme.label;
            selector.appendChild(option);
        }
        selector.value = 'fire';

        // ============================================================================
        // THREE.JS SCENE SETUP
        // ============================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111118); 
        scene.fog = new THREE.Fog(0x111118, 10, 50);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 12, 16); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ============================================================================
        // ENVIRONMENT MAP FOR PBR REFLECTIONS
        // ============================================================================
        function createStudioEnvironment() {
            const envScene = new THREE.Scene();
            
            // Create a gradient background for reflections
            const gradientCanvas = document.createElement('canvas');
            gradientCanvas.width = 512;
            gradientCanvas.height = 512;
            const ctx = gradientCanvas.getContext('2d');
            
            // Dark gradient for dramatic lighting
            const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
            gradient.addColorStop(0, '#444444');
            gradient.addColorStop(0.5, '#222222');
            gradient.addColorStop(1, '#111111');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // Add some light spots for reflections
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            ctx.arc(128, 128, 100, 0, Math.PI * 2);
            const lightGrad = ctx.createRadialGradient(128, 128, 0, 128, 128, 100);
            lightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            lightGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = lightGrad;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(384, 384, 80, 0, Math.PI * 2);
            ctx.fillStyle = lightGrad;
            ctx.fill();
            
            const envTexture = new THREE.CanvasTexture(gradientCanvas);
            envTexture.mapping = THREE.EquirectangularReflectionMapping;
            envScene.background = envTexture;
            
            return envScene;
        }

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        const envScene = createStudioEnvironment();
        const envMap = pmremGenerator.fromScene(envScene).texture;
        scene.environment = envMap;

        // ============================================================================
        // FLOOR TEXTURE AND MESH
        // ============================================================================
        function createFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#44403c'; ctx.fillRect(0, 0, 1024, 1024);
            for (let i = 0; i < 50000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#78716c' : '#171717';
                ctx.globalAlpha = Math.random() * 0.3;
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, Math.random() * 3, Math.random() * 3);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(8, 8); 
            return texture;
        }

        const floorMaterial = new THREE.MeshStandardMaterial({ 
            map: createFloorTexture(), color: 0xffffff, roughness: 0.9, metalness: 0.1
        });
        const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMaterial);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // ============================================================================
        // THEME-SPECIFIC TEXTURE GENERATION
        // ============================================================================
        function createDiceTexture(theme) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const baseColor = '#' + theme.material.baseColor.toString(16).padStart(6, '0');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 512, 512);
            
            // Apply theme-specific texture patterns
            switch(theme.key) {
                case 'fire':
                    drawFlamePatterns(ctx, theme);
                    break;
                case 'ice':
                    drawIceCrystals(ctx, theme);
                    break;
                case 'necrotic':
                    drawNecroticVeins(ctx, theme);
                    break;
                case 'radiant':
                    drawRadiantPattern(ctx, theme);
                    break;
                case 'acid':
                    drawAcidPattern(ctx, theme);
                    break;
                case 'lightning':
                    drawLightningPattern(ctx, theme);
                    break;
                case 'force':
                    drawForcePattern(ctx, theme);
                    break;
                case 'psychic':
                    drawPsychicPattern(ctx, theme);
                    break;
                case 'nature':
                    drawNaturePattern(ctx, theme);
                    break;
                case 'thunder':
                    drawThunderPattern(ctx, theme);
                    break;
                case 'holy':
                    drawHolyPattern(ctx, theme);
                    break;
                case 'shadow':
                    drawShadowPattern(ctx, theme);
                    break;
                case 'blood':
                    drawBloodPattern(ctx, theme);
                    break;
                default:
                    drawOrganicNoise(ctx, theme);
            }
            
            return new THREE.CanvasTexture(canvas);
        }

        // ============================================================================
        // THEME-SPECIFIC DRAWING FUNCTIONS
        // ============================================================================
        function drawFlamePatterns(ctx, theme) {
            // Flame swirl patterns with ember-like particles - INTENSE
            ctx.globalCompositeOperation = 'lighter';
            
            // Large flame gradients
            for (let i = 0; i < 25; i++) {
                const gradient = ctx.createRadialGradient(
                    256 + Math.random() * 200 - 100,
                    256 + Math.random() * 200 - 100,
                    0,
                    256 + Math.random() * 100 - 50,
                    256 + Math.random() * 100 - 50,
                    300 + Math.random() * 150
                );
                gradient.addColorStop(0, 'rgba(255, 255, 100, 0.8)');
                gradient.addColorStop(0.2, 'rgba(255, 150, 0, 0.6)');
                gradient.addColorStop(0.5, 'rgba(255, 80, 0, 0.4)');
                gradient.addColorStop(1, 'rgba(200, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 512, 512);
            }
            
            // Bright ember particles
            ctx.fillStyle = 'rgba(255, 255, 200, 1)';
            for (let i = 0; i < 200; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 4 + 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Hot spots
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            for (let i = 0; i < 50; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 2 + 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawIceCrystals(ctx, theme) {
            // Crystalline structures with bright fractures
            ctx.globalCompositeOperation = 'lighter';
            
            // Ice crystal glow
            const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 350);
            gradient.addColorStop(0, 'rgba(200, 240, 255, 0.6)');
            gradient.addColorStop(0.5, 'rgba(100, 200, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(50, 100, 200, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // Bright crystal lines
            ctx.strokeStyle = 'rgba(220, 250, 255, 0.9)';
            ctx.lineWidth = 2;
            
            for (let i = 0; i < 50; i++) {
                ctx.beginPath();
                const x1 = Math.random() * 512;
                const y1 = Math.random() * 512;
                const angle = Math.random() * Math.PI * 2;
                const length = Math.random() * 250 + 100;
                ctx.moveTo(x1, y1);
                ctx.lineTo(x1 + Math.cos(angle) * length, y1 + Math.sin(angle) * length);
                ctx.stroke();
                
                // Branches
                for (let j = 0; j < 5; j++) {
                    const branchAngle = angle + (Math.random() - 0.5) * Math.PI / 2;
                    const branchLen = length * 0.5;
                    const bx = x1 + Math.cos(angle) * length * (0.2 + j * 0.15);
                    const by = y1 + Math.sin(angle) * length * (0.2 + j * 0.15);
                    ctx.moveTo(bx, by);
                    ctx.lineTo(bx + Math.cos(branchAngle) * branchLen, by + Math.sin(branchAngle) * branchLen);
                }
            }
            
            // Bright ice sparkles
            ctx.fillStyle = 'rgba(255, 255, 255, 1)';
            for (let i = 0; i < 120; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 3 + 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawNecroticVeins(ctx, theme) {
            // Dark veins spreading across surface - PRONOUNCED
            ctx.globalCompositeOperation = 'lighter';
            
            // Purple corruption glow
            for (let i = 0; i < 20; i++) {
                const gradient = ctx.createRadialGradient(
                    Math.random() * 512, Math.random() * 512, 0,
                    Math.random() * 512, Math.random() * 512, Math.random() * 200 + 100
                );
                gradient.addColorStop(0, 'rgba(150, 50, 200, 0.6)');
                gradient.addColorStop(0.5, 'rgba(100, 20, 150, 0.4)');
                gradient.addColorStop(1, 'rgba(50, 0, 80, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 512, 512);
            }
            
            // Dark veins
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = 'rgba(80, 20, 120, 0.9)';
            ctx.lineWidth = 3;
            
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                let x = Math.random() * 512;
                let y = Math.random() * 512;
                ctx.moveTo(x, y);
                
                for (let j = 0; j < 12; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const length = Math.random() * 80 + 30;
                    x += Math.cos(angle) * length;
                    y += Math.sin(angle) * length;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            
            // Corruption spots glow
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = 'rgba(180, 80, 255, 0.8)';
            for (let i = 0; i < 60; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 20 + 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawRadiantPattern(ctx, theme) {
            // Golden light rays emanating from center - BLAZING
            ctx.globalCompositeOperation = 'lighter';
            
            // Central glow - very bright
            const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 350);
            gradient.addColorStop(0, 'rgba(255, 255, 220, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 240, 150, 0.9)');
            gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.6)');
            gradient.addColorStop(0.8, 'rgba(255, 180, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(200, 100, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // Bright light rays
            ctx.strokeStyle = 'rgba(255, 255, 200, 0.8)';
            ctx.lineWidth = 4;
            for (let i = 0; i < 24; i++) {
                const angle = (i / 24) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(256 + Math.cos(angle) * 40, 256 + Math.sin(angle) * 40);
                ctx.lineTo(256 + Math.cos(angle) * 480, 256 + Math.sin(angle) * 480);
                ctx.stroke();
            }
            
            // Secondary rays
            ctx.strokeStyle = 'rgba(255, 230, 100, 0.5)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 48; i++) {
                const angle = (i / 48) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(256 + Math.cos(angle) * 30, 256 + Math.sin(angle) * 30);
                ctx.lineTo(256 + Math.cos(angle) * 400, 256 + Math.sin(angle) * 400);
                ctx.stroke();
            }
            
            // Sparkle points
            ctx.fillStyle = 'rgba(255, 255, 255, 1)';
            for (let i = 0; i < 150; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 3 + 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }
            
            // Sparkle points
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            for (let i = 0; i < 80; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 2 + 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawAcidPattern(ctx, theme) {
            // Bubbling acid texture - TOXIC
            ctx.globalCompositeOperation = 'lighter';
            
            // Bright acid pools
            for (let i = 0; i < 30; i++) {
                const gradient = ctx.createRadialGradient(
                    Math.random() * 512, Math.random() * 512, 0,
                    Math.random() * 512, Math.random() * 512, Math.random() * 120 + 60
                );

        function createNumberTexture(text, theme) {

        // ============================================================================
        // ADD NUMBERS TO MESH
        // ============================================================================
        function addNumbersToMesh(mesh, sides, theme) {
            const geometry = mesh.geometry;
            geometry.computeVertexNormals();
            const pos = geometry.attributes.position;
            const faces = [];
            
            for (let i = 0; i < pos.count; i += 3) {
                const a = new THREE.Vector3().fromBufferAttribute(pos, i);
                const b = new THREE.Vector3().fromBufferAttribute(pos, i+1);
                const c = new THREE.Vector3().fromBufferAttribute(pos, i+2);
                const center = new THREE.Vector3().add(a).add(b).add(c).divideScalar(3);
                const normal = new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(b, a), new THREE.Vector3().subVectors(c, a)).normalize();
                let f = faces.find(f => f.normal.dot(normal) > 0.99);
                if (f) { f.center.add(center); f.count++; } else { faces.push({ normal, center, count: 1 }); }
            }
            faces.forEach(f => f.center.divideScalar(f.count));
            faces.forEach((face, index) => {
                if (index >= sides && sides !== 10) return;
                let num = sides === 10 ? (index % 10) : index + 1;
                const tex = createNumberTexture(num.toString(), theme);
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, side: THREE.DoubleSide });
                const label = new THREE.Mesh(new THREE.PlaneGeometry(sides === 4 ? 0.5 : 0.8, sides === 4 ? 0.5 : 0.8), mat);
                label.position.copy(face.center).multiplyScalar(1.03);
                label.lookAt(new THREE.Vector3().copy(face.center).multiplyScalar(2));
                mesh.add(label);
            });
        }

        // ============================================================================
        // AUDIO FOR DICE SOUNDS
        // ============================================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playDiceSound(velocity) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (velocity < 0.5) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 300 + (velocity * 50) + (Math.random() * 100);
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(Math.min(velocity / 10, 1), now + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.start(now); osc.stop(now + 0.1);
        }

        // ============================================================================
        // CREATE DIE WITH ENHANCED PBR MATERIAL
        // ============================================================================
        let dice = [];
        function createDie(sides, themeKey, position) {
            const theme = THEMES[themeKey];
            if (!theme) {
                console.error('Theme not found:', themeKey);
                return null;
            }
            
            let geometry, shape;
            const size = 1;
            switch(sides) {
                case 4: geometry = new THREE.TetrahedronGeometry(size); shape = new CANNON.Sphere(size * 0.7); break;
                case 6: geometry = new THREE.BoxGeometry(size, size, size); shape = new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2)); break;
                case 8: geometry = new THREE.OctahedronGeometry(size); shape = new CANNON.Sphere(size * 0.8); break;
                case 10: geometry = new THREE.DodecahedronGeometry(size * 0.9); shape = new CANNON.Sphere(size * 0.9); break;
                case 12: geometry = new THREE.DodecahedronGeometry(size); shape = new CANNON.Sphere(size); break;
                case 20: geometry = new THREE.IcosahedronGeometry(size); shape = new CANNON.Sphere(size); break;
            }
            
            // Create PBR material with theme properties
            const textureMap = createDiceTexture(theme);
            const mat = new THREE.MeshPhysicalMaterial({
                color: theme.material.baseColor,
                metalness: theme.material.metalness ?? 0.3,
                roughness: theme.material.roughness ?? 0.4,
                emissive: theme.material.emissive ?? 0x000000,
                emissiveIntensity: theme.material.emissiveIntensity ?? 0.3,
                clearcoat: theme.material.clearcoat ?? 0.5,
                clearcoatRoughness: theme.material.clearcoatRoughness ?? 0.1,
                map: textureMap,
                envMap: envMap,
                envMapIntensity: 1.0,
            });
            
            // Add transmission for translucent materials (ice)
            if (theme.material.transmission) {
                mat.transmission = theme.material.transmission;
                mat.thickness = theme.material.thickness ?? 0.5;
            }
            
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // Add theme-specific glow light attached to die
            if (theme.material.emissiveIntensity > 0.2) {
                const glowLight = new THREE.PointLight(
                    theme.material.emissive,
                    theme.material.emissiveIntensity * 1.5,
                    8
                );
                mesh.add(glowLight);
            }
            
            addNumbersToMesh(mesh, sides, theme);
            
            const body = new CANNON.Body({ mass: 1, shape, linearDamping: 0.3, angularDamping: 0.3 });
            body.position.set(position.x + (Math.random() - 0.5) * 2, position.y + Math.random() * 3, position.z + (Math.random() - 0.5) * 2);
            body.velocity.set((Math.random() - 0.5) * 5, Math.random() * 3, (Math.random() - 0.5) * 5);
            body.angularVelocity.set((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20);
            
            body.addEventListener("collide", (e) => {
                if(Math.abs(e.contact.getImpactVelocityAlongNormal()) > 1.5) {
                    playDiceSound(Math.abs(e.contact.getImpactVelocityAlongNormal()));
                }
            });
            
            scene.add(mesh);
            world.addBody(body);
            
            return { mesh, body, sides, themeKey, settled: false };
        }

        function calculateResult(die) { return Math.floor(Math.random() * die.sides) + 1; }

        // ============================================================================
        // ROLL DICE FUNCTION
        // ============================================================================
        window.rollDice = function() {
            // Remove existing dice
            dice.forEach(d => {
                scene.remove(d.mesh);
                world.removeBody(d.body);
            });
            dice = [];
            
            // Clear old theme lights
            themeLights.forEach(light => scene.remove(light));
            themeLights = [];
            
            const count = parseInt(document.getElementById('dice-count').value);
            const sides = parseInt(document.getElementById('dice-type').value);
            const themeKey = document.getElementById('theme-selector').value;
            const theme = THEMES[themeKey];
            
            document.getElementById('result-display').innerHTML = '<div class="rolling-indicator">🎲 Rolling...</div>';
            
            // Add theme-specific ambient lighting
            if (theme.material.emissive && theme.material.emissiveIntensity > 0.1) {
                const themeAmbientLight = new THREE.PointLight(
                    theme.material.emissive,
                    theme.material.emissiveIntensity * 0.8,
                    25
                );
                themeAmbientLight.position.set(0, 8, 0);
                scene.add(themeAmbientLight);
                themeLights.push(themeAmbientLight);
            }
            
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const die = createDie(sides, themeKey, {
                    x: Math.cos(angle) * 2,
                    y: 8,
                    z: Math.sin(angle) * 2
                });
                if (die) {
                    dice.push(die);
                }
            }
            
            setTimeout(() => {
                const results = dice.map(die => calculateResult(die));
                const total = results.reduce((a, b) => a + b, 0);
                const colorHex = '#' + theme.material.baseColor.toString(16).padStart(6, '0');
                document.getElementById('result-display').innerHTML = `
                    <div class="result-total">${total}</div>
                    <div class="result-details">${results.join(' + ')}</div>
                    <div class="result-details" style="color: ${colorHex}">${count}d${sides}</div>`;
            }, 3000);
        };

        // ============================================================================
        // ANIMATION LOOP
        // ============================================================================
        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);
            dice.forEach(die => {
                die.mesh.position.copy(die.body.position);
                die.mesh.quaternion.copy(die.body.quaternion);
            });
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
