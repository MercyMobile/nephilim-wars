<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Nephilim Wars - Archives</title>
    <link href='https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Roboto+Condensed:wght@300;400;700&display=swap' rel='stylesheet'>
    <style>
        :root {
            --primary: #8B2E3F; --secondary: #4A6FA5; --accent: #C19A6B; --dark: #0c0a09; --light: #F3E9DC;
            --angel: #4A6FA5; --demon: #8B2E3F; --fallen: #6B3FA0; --giant: #8B6914; --human: #5A7247;
            --cave: #6B5B4B; --mighty: #A85B20; --under: #4B6B6B; --archive-bg: #14110f; --archive-border: #3d342d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                radial-gradient(circle at 20% 50%, rgba(139,46,63,0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(74,111,165,0.04) 0%, transparent 50%);
            color: var(--light); font-family: 'Crimson Pro', serif; min-height: 100vh;
        }
        
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 2rem; }
        .modal-overlay.open { display: flex; }
        .modal-card { background: var(--archive-bg); border: 1px solid var(--archive-border); border-radius: 4px; max-width: 1300px; width: 95%; height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 100px rgba(0,0,0,1); position: relative; }
        #modalContent { display: flex; flex-direction: row; width: 100%; height: 100%; overflow: hidden; }
        .modal-sidebar { width: 400px; min-width: 400px; background: #080706; border-right: 1px solid var(--archive-border); display: flex; flex-direction: column; overflow-y: auto; color: var(--light); }
        .modal-main { flex: 1; padding: 3.5rem; overflow-y: auto; background-image: radial-gradient(circle at top right, rgba(193,154,107,0.03), transparent); position: relative; background-color: var(--archive-bg); color: var(--light); }
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: rgba(0,0,0,0.5); border: 1px solid var(--archive-border); color: var(--accent); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; z-index: 1100; font-size: 1.5rem; transition: all 0.2s; }
        .modal-close:hover { background: var(--accent); color: var(--dark); }
        .modal-art { width: 100%; height: 450px; object-fit: cover; object-position: center; border-bottom: 1px solid var(--archive-border); }
        
        /* Dossier Text */
        .dossier-header { border-bottom: 1px solid var(--accent); margin-bottom: 2.5rem; padding-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: flex-end; }
        .dossier-id { font-family: 'Cinzel', serif; font-size: 0.75rem; color: var(--accent); opacity: 0.5; letter-spacing: 0.4em; }
        .scholarly-section { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid rgba(193,154,107,0.1); }
        .scholarly-section h3 { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--accent); text-transform: uppercase; margin-bottom: 1.5rem; letter-spacing: 0.2em; display: flex; align-items: center; gap: 1rem; }
        .scholarly-section h3::after { content: ''; flex: 1; height: 1px; background: rgba(193,154,107,0.15); }
        .academic-text { font-size: 1.1rem; line-height: 1.9; color: rgba(243,233,220,0.85); text-align: justify; margin-bottom: 1.5rem; }
        .academic-text b { color: var(--accent); font-weight: 600; }
        
        .manuscript-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .manuscript-item { font-size: 0.85rem; color: var(--secondary); background: rgba(74,111,165,0.08); padding: 0.8rem; border-left: 3px solid var(--secondary); font-family: 'Roboto Condensed', sans-serif; }

        /* Header & Navigation */
        /* --- NAVIGATION BAR --- */
        .nav-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(28, 25, 23, 0.95);
            border-bottom: 2px solid #78350f;
            padding: 15px 20px;
            display: flex; gap: 20px; z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        /* Hide nav when in iframe */
        body.in-iframe .nav-bar { display: none; }
        body.in-iframe .card-grid { margin-top: 20px; }

        .nav-link {
            color: #fcd34d; text-decoration: none; font-weight: bold;
            text-transform: uppercase; letter-spacing: 1px; font-size: 14px;
            transition: all 0.3s; display: flex; align-items: center; gap: 8px;
            font-family: 'Cinzel', serif;
        }
        .nav-link:hover { color: #fff; text-shadow: 0 0 10px #f59e0b; }

        header { margin-top: 60px; }

        header h1 { font-family: 'Cinzel', serif; color: var(--accent); font-size: 1.8rem; letter-spacing: 0.15em; }
        header h1 span { color: var(--secondary); font-size: 0.5em; display: block; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .filter-btn { background: rgba(193,154,107,0.1); border: 1px solid rgba(193,154,107,0.3); color: var(--light); padding: 0.5rem 1.2rem; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; font-family: 'Cinzel', serif; transition: all 0.2s; letter-spacing: 0.1em; }
        .filter-btn.active { background: var(--accent); color: var(--dark); box-shadow: 0 0 15px rgba(193,154,107,0.4); }
        .search-input { background: rgba(0,0,0,0.4); border: 1px solid var(--archive-border); color: var(--light); padding: 0.5rem 1rem; border-radius: 4px; width: 250px; outline: none; font-family: 'Roboto Condensed', sans-serif; }
        .search-input:focus { border-color: var(--accent); }

        /* Card Grid */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; padding: 3rem 2rem; max-width: 1600px; margin: 0 auto; }
        .mtg-card { perspective: 1000px; cursor: pointer; height: 450px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .mtg-card:hover { transform: translateY(-15px) scale(1.02); }
        .mtg-card-inner { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.7); }
        .card-frame { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; border: 4px solid; border-radius: 16px; overflow: hidden; background: #14110f; }
        
        /* Frame Colors */
        .card-frame[data-type="Angel"]   { border-color: var(--angel); background: linear-gradient(to bottom, #14110f, #1a1e24); }
        .card-frame[data-type="Demon"]   { border-color: var(--demon); background: linear-gradient(to bottom, #14110f, #241a1a); }
        .card-frame[data-type="Fallen"]  { border-color: var(--fallen); background: linear-gradient(to bottom, #14110f, #1e1a24); }
        .card-frame[data-type="Giant"]   { border-color: var(--giant); background: linear-gradient(to bottom, #14110f, #24211a); }
        .card-frame[data-type="Human"]   { border-color: var(--human); background: linear-gradient(to bottom, #14110f, #1a241a); }
        .card-frame[data-type="Cave Dweller"] { border-color: var(--cave); }
        .card-frame[data-type="Mighty One"]   { border-color: var(--mighty); }
        .card-frame[data-type="Under-Walker"] { border-color: var(--under); }
        .card-frame[data-type="Beast"] { border-color: var(--accent); }
        .card-frame[data-type="Spirit"] { border-color: var(--secondary); }

        .card-title-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1rem; background: rgba(0,0,0,0.7); border-bottom: 1px solid rgba(193,154,107,0.3); }
        .card-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-art-container { height: 200px; overflow: hidden; border-bottom: 2px solid rgba(193,154,107,0.4); background: #000; position: relative; }
        .card-art-container img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .card-type-line { padding: 0.4rem 1rem; background: rgba(0,0,0,0.5); font-size: 0.7rem; text-transform: uppercase; font-weight: bold; border-bottom: 1px solid rgba(193,154,107,0.2); letter-spacing: 0.1em; color: var(--light); }
        .card-text-box { flex: 1; padding: 0.8rem 1rem; background: rgba(26,18,11,0.2); display: flex; flex-direction: column; gap: 0.5rem; overflow: hidden; }
        .card-description { font-size: 0.85rem; line-height: 1.5; color: rgba(243,233,220,0.9); font-family: 'Roboto Condensed', sans-serif; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        
        .stat-badge { font-size: 0.65rem; background: rgba(193,154,107,0.2); color: var(--accent); padding: 0.2rem 0.5rem; border-radius: 3px; border: 1px solid rgba(193,154,107,0.4); font-family: 'Cinzel', serif; }

        /* Tactical Data */
        .rpg-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 2rem 0; }
        .rpg-stat-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(193,154,107,0.3); padding: 1rem; border-radius: 2px; text-align: center; border-left: 4px solid var(--accent); }
        .rpg-stat-val { font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--accent); display: block; font-weight: 900; }
        .rpg-stat-lbl { font-size: 0.7rem; text-transform: uppercase; color: rgba(243,233,220,0.5); letter-spacing: 0.2em; font-family: 'Roboto Condensed', sans-serif; }
        
        .action-list { margin-top: 2rem; border: 1px solid rgba(193,154,107,0.1); border-radius: 4px; overflow: hidden; }
        .action-item { background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(193,154,107,0.1); padding: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .action-item:last-child { border-bottom: none; }
        .action-header { display: flex; justify-content: space-between; align-items: center; }
        .action-name { font-family: 'Cinzel', serif; color: var(--secondary); font-size: 1rem; font-weight: 700; }
        .action-desc { font-size: 0.95rem; color: rgba(243,233,220,0.75); line-height: 1.6; }
        .action-meta { font-size: 0.7rem; color: var(--accent); font-family: monospace; text-transform: uppercase; }

        @media (max-width: 900px) { .modal-card { flex-direction: column; height: 95vh; } .modal-sidebar { width: 100%; min-width: 100%; height: 350px; border-right: none; } .modal-main { padding: 2rem; } }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="../index.html" class="nav-link">🏠 Home</a>
        <a href="../DiceRoller/index.html" class="nav-link">🎲 Dice</a>
        <a href="../combat/index.html" class="nav-link">⚔️ Combat</a>
        <a href="nephilim_wars_races_and_peoples.html" class="nav-link">👥 Races & Peoples</a>
    </nav>

<header>
    <h1>Nephilim Wars <span>Archives</span></h1>
    <div class="filter-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Search Archives...">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Angel">Angels</button>
        <button class="filter-btn" data-filter="Demon">Demons</button>
        <button class="filter-btn" data-filter="Fallen">Fallen</button>
        <button class="filter-btn" data-filter="Giant">Giants</button>
        <button class="filter-btn" data-filter="combat">Combat</button>
        <button class="filter-btn" data-filter="legendary">Legends</button>
    </div>
</header>
<p style="padding: 1.5rem 2rem 0.5rem; font-size: 0.9rem; color: var(--accent); opacity: 0.7; font-family: 'Cinzel', serif; letter-spacing: 0.1em;" id="cardCount"></p>
<div class="card-grid" id="cardGrid"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
        <button class="modal-close" id="modalClose">&times;</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>
const imageMap = {
    michael: '../images/rutkowski/Angel/michael.png', gabriel: '../images/rutkowski/Angel/gabriel.png', raphael: '../images/rutkowski/Angel/raphael.png',
    uriel: '../images/rutkowski/Angel/uriel.png', sariel: '../images/rutkowski/Angel/sariel.png', raguel: '../images/rutkowski/Angel/raguel.png',
    remiel: '../images/rutkowski/Angel/remiel.png', metatron: '../images/rutkowski/Angel/metatron.png', raziel: '../images/rutkowski/Angel/raziel.png',
    azrael: '../images/rutkowski/Angel/azrael.png', satan: '../images/rutkowski/Demon/satan.png', semyaza: '../images/rutkowski/Fallen/semyaza.png',
    azazel: '../images/rutkowski/Fallen/azazel.png', lilith: '../images/rutkowski/Demon/lilith.png', asmodeus: '../images/rutkowski/Demon/asmodeus.png',
    belial: '../images/rutkowski/Demon/belial.png', mastema: '../images/rutkowski/Demon/mastema.png', abaddon: '../images/rutkowski/Demon/abaddon.png',
    gadreel: '../images/rutkowski/Fallen/gadreel.png', prince_persia: '../images/rutkowski/Demon/prince_persia.png', baraqel: '../images/rutkowski/Fallen/baraqel.png',
    kokabiel: '../images/rutkowski/Fallen/kokabiel.png', penemue: '../images/rutkowski/Fallen/penemue.png', armaros: '../images/rutkowski/Fallen/armaros.png',
    kasdeja: '../images/rutkowski/Fallen/kasdeja.png', nephilim_warrior: '../images/rutkowski/Giant/nephilim_warrior.png', nephilim_warlord: '../images/rutkowski/Giant/nephilim_warlord.png',
    nephilim_scout: '../images/rutkowski/Giant/nephilim_scout.png', nephilim_hunter: '../images/rutkowski/Giant/nephilim_hunter.png', rephaim_champion: '../images/rutkowski/Giant/rephaim_champion.png',
    rephaim_warrior: '../images/rutkowski/Giant/rephaim_warrior.png', rephaim_deathspeaker: '../images/rutkowski/Giant/rephaim_deathspeaker.png', anakim_berserker: '../images/rutkowski/Giant/anakim_berserker.png',
    horim_tunneler: '../images/rutkowski/Cave Dweller/horim_tunneler.png', horim_stoneshaper: '../images/rutkowski/Cave Dweller/horim_stoneshaper.png', gibborim_elite: '../images/rutkowski/Mighty One/gibborim_elite.png',
    gibborim: '../images/rutkowski/Mighty One/gibborim.png', gammadim_tunnelfighter: '../images/rutkowski/Under-Walker/gammadim_tunnelfighter.png', gammadim_earthspeaker: '../images/rutkowski/Under-Walker/gammadim_earthspeaker.png',
    elioud_deceiver: '../images/rutkowski/Giant/elioud_deceiver.png', elioud_champion: '../images/rutkowski/Giant/elioud_champion.png', ohya: '../images/rutkowski/Giant/ohya.png',
    hahya: '../images/rutkowski/Giant/hahya.png', mahway: '../images/rutkowski/Giant/mahway.png', gilgamesh: '../images/rutkowski/Giant/Gilgamesh.png',
    baal_priest: '../images/rutkowski/Human/baal_priest.png', lamech: '../images/rutkowski/Human/lamech.png', cainite_assassin: '../images/rutkowski/Human/cainite_assassin.png',
    cainite_warrior: '../images/rutkowski/Human/cainite_warrior.png', sorcerer_priest: '../images/rutkowski/Human/sorcerer_priest.png', watcher_cult_leader: '../images/rutkowski/Human/watcher_cult_leader.png',
    watcher_cultist: '../images/rutkowski/Human/watcher_cultist.png', desert_raider: '../images/rutkowski/Human/desert_raider.png', refaim_wraith: '../images/rutkowski/Spirit/refaim_wraith.png',
    refaim_spirit: '../images/rutkowski/Spirit/refaim_spirit.png', behemoth: '../images/rutkowski/Beast/behemoth.png', leviathan: '../images/rutkowski/Beast/leviathan.png',
    ziz: '../images/rutkowski/Beast/ziz.png',
};
const fallbackImg = '../images/rutkowski/Angel/michael.png';
function getImage(id) { return imageMap[id] || fallbackImg; }

let allCards = [];
let filteredCards = [];
let currentFilter = 'all';
let searchQuery = '';

async function loadData() {
    let bestiaryData = { entries: [] };
    let combatBestiaryData = { enemies: [] };
    let creaturesData = { giants: { entries: [] }, corrupted: { entries: [] }, beasts: { entries: [] } };

    try {
        const [bestiaryRes, combatRes, creaturesRes] = await Promise.all([
            fetch('../data/bestiary.json'),
            fetch('../data/combat-bestiary.json'),
            fetch('../data/creatures.json')
        ]);
        if (bestiaryRes.ok) bestiaryData = await bestiaryRes.json();
        if (combatRes.ok) combatBestiaryData = await combatRes.json();
        if (creaturesRes.ok) creaturesData = await creaturesRes.json();
    } catch (e) {
        console.error('Failed to load data:', e);
    }
    
    allCards = [];
    if (bestiaryData && bestiaryData.entries) {
        for (const entry of bestiaryData.entries) {
            allCards.push({ source: 'bestiary', ...entry, image: getImage(entry.id) });
        }
    }
    
    if (combatBestiaryData && combatBestiaryData.enemies) {
        for (const enemy of combatBestiaryData.enemies) {
            allCards.push({ source: 'combat', ...enemy, classification: `Level ${enemy.level} ${enemy.size}`, image: getImage(enemy.id) });
        }
    }
    
    const sections = [
        { data: creaturesData.giants, type: 'Giant' }, 
        { data: creaturesData.corrupted, type: 'Human' }, 
        { data: creaturesData.beasts, type: 'Beast' }
    ];
    
    for (const section of sections) {
        if (section.data && section.data.entries) {
            for (const c of section.data.entries) {
                allCards.push({ source: 'legendary', ...c, type: section.type, classification: `HD ${c.hd} — ${c.special}`, image: getImage(c.id) });
            }
        }
    }
    applyFilters();
}

function applyFilters() {
    console.log(`Applying Filter: ${currentFilter}, Search: ${searchQuery}`);
    filteredCards = allCards.filter(card => {
        const name = card.name.toLowerCase();
        const type = (card.type || '').toLowerCase();
        const query = searchQuery.toLowerCase();
        const matchesSearch = name.includes(query) || type.includes(query);
        
        if (!matchesSearch) return false;
        
        if (currentFilter === 'all') return true;
        if (currentFilter === 'combat') return card.source === 'combat';
        if (currentFilter === 'legendary') return card.source === 'legendary';
        
        // Handle specific type filters (Angel, Demon, Fallen, Giant, Human)
        return type === currentFilter.toLowerCase();
    });
    renderCards(filteredCards);
}

function renderCards(cards) {
    const grid = document.getElementById('cardGrid'); 
    grid.innerHTML = '';
    document.getElementById('cardCount').textContent = `${cards.length} recovery entries synthesized`;
    for (const card of cards) {
        const el = document.createElement('div'); 
        el.className = 'mtg-card'; 
        el.innerHTML = buildCardHTML(card);
        el.addEventListener('click', () => openModal(card)); 
        grid.appendChild(el);
    }
}

function buildCardHTML(card) {
    let statsLine = '';
    if (card.stats) statsLine = `<div class="stat-badge">HP ${card.stats.hp}</div> <div class="stat-badge">DEF ${card.stats.defense}</div>`;
    else if (card.hp) statsLine = `<div class="stat-badge">HP ${card.hp}</div> <div class="stat-badge">DEF ${card.def || card.ac || ''}</div>`;

    return `
        <div class="mtg-card-inner">
            <div class="card-frame" data-type="${card.type}">
                <div class="card-title-bar">
                    <span class="card-name">${card.name}</span>
                    ${card.level ? `<span class="stat-badge">LVL ${card.level}</span>` : ''}
                </div>
                <div class="card-art-container"><img src="${card.image}" loading="lazy"></div>
                <div class="card-type-line"><span>${card.type}</span></div>
                <div class="card-text-box">
                    <div style="display:flex; gap:0.3rem; margin-bottom:0.2rem;">${statsLine}</div>
                    <p class="card-description">${card.description}</p>
                </div>
            </div>
        </div>`;
}

function openModal(card) {
    const overlay = document.getElementById('modalOverlay'); 
    const content = document.getElementById('modalContent');
    
    let sidebar = `
        <div class="modal-sidebar">
            <img class="modal-art" src="${card.image}">
            <div style="padding:2.5rem;">
                <h2 style="font-family:'Cinzel', serif; color:var(--accent); margin-bottom:0.5rem; font-size:1.8rem;">${card.name}</h2>
                <div style="color:var(--secondary); font-size:0.9rem; text-transform:uppercase; letter-spacing:0.2em; margin-bottom:2rem; font-weight:bold;">${card.type}</div>
                
                ${card.classification ? `<div style="margin-bottom:1.2rem;"><div style="font-size:0.6rem; color:rgba(243,233,220,0.4); text-transform:uppercase; letter-spacing:0.1em;">Archive Classification</div><div style="font-size:1rem; color:var(--light); font-family:'Cinzel', serif;">${card.classification}</div></div>` : ''}
                ${card.translation ? `<div style="margin-bottom:1.2rem;"><div style="font-size:0.6rem; color:rgba(243,233,220,0.4); text-transform:uppercase; letter-spacing:0.1em;">Etymological Root</div><div style="font-size:1rem; color:var(--accent); font-style:italic;">"${card.translation}"</div></div>` : ''}
                
                ${card.roles ? `
                    <div style="margin-top:2.5rem;">
                        <div style="font-size:0.6rem; color:rgba(243,233,220,0.4); text-transform:uppercase; margin-bottom:0.8rem; letter-spacing:0.1em;">Celestial Jurisdictions</div>
                        <div style="display:flex; flex-wrap:wrap; gap:0.5rem;">
                            ${card.roles.map(role => `<span style="font-size:0.75rem; background:rgba(74,111,165,0.15); border:1px solid rgba(74,111,165,0.3); padding:0.3rem 0.7rem; border-radius:2px; color:var(--secondary);">${role}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}
            </div>
        </div>`;

    let academicSection = '';
    if (card.academicDossier) {
        academicSection = `
            <div class="scholarly-section">
                <h3>Scholarly Synthesis</h3>
                <p class="academic-text">${card.academicDossier.scholarlySynthesis}</p>
            </div>
            <div class="scholarly-section">
                <h3>Anthropological Insights</h3>
                <p class="academic-text">${card.academicDossier.anthropologicalInsights}</p>
            </div>
            <div class="scholarly-section">
                <h3>Esoteric & Mythical Beliefs</h3>
                <p class="academic-text">${card.academicDossier.mythicalBeliefs}</p>
            </div>
        `;
    }

    let combatSection = '';
    if (card.stats || card.hd) {
        let statsHtml = '';
        if (card.stats) {
            statsHtml = `
                <div class="rpg-stats-grid">
                    <div class="rpg-stat-box"><span class="rpg-stat-val">${card.stats.hp}</span><span class="rpg-stat-lbl">HP</span></div>
                    <div class="rpg-stat-box"><span class="rpg-stat-val">${card.stats.defense}</span><span class="rpg-stat-lbl">DEF</span></div>
                    <div class="rpg-stat-box"><span class="rpg-stat-val">${card.stats.speed}ft</span><span class="rpg-stat-lbl">SPD</span></div>
                    <div class="rpg-stat-box"><span class="rpg-stat-val">+${card.stats.STR}</span><span class="rpg-stat-lbl">STR</span></div>
                    <div class="rpg-stat-box"><span class="rpg-stat-val">+${card.stats.DEX}</span><span class="rpg-stat-lbl">DEX</span></div>
                    <div class="rpg-stat-box"><span class="rpg-stat-val">+${card.stats.CON}</span><span class="rpg-stat-lbl">CON</span></div>
                </div>`;
        } else {
            statsHtml = `
                <div class="rpg-stats-grid">
                    <div class="rpg-stat-box"><span class="rpg-stat-val">${card.hd}</span><span class="rpg-stat-lbl">Hit Dice</span></div>
                    <div class="rpg-stat-box"><span class="rpg-stat-val">${card.hp}</span><span class="rpg-stat-lbl">HP</span></div>
                    <div class="rpg-stat-box"><span class="rpg-stat-val">${card.def || card.ac || 'N/A'}</span><span class="rpg-stat-lbl">Armor Class</span></div>
                </div>`;
        }

        let actionsHtml = '';
        if (card.actions) {
            actionsHtml = `
                <div class="action-list">
                    ${card.actions.map(a => `
                        <div class="action-item">
                            <div class="action-header">
                                <div class="action-name">${a.name}</div>
                                <div class="action-meta">+${a.toHitBonus} To Hit // ${a.damageDice}${a.damageBonus >= 0 ? '+' : ''}${a.damageBonus} ${a.damageType}</div>
                            </div>
                            <div class="action-desc">Cost: ${a.cost} Action(s) // ${a.traits ? a.actions.join(', ') : ''}</div>
                        </div>
                    `).join('')}
                </div>`;
        } else if (card.attack) {
            actionsHtml = `<div class="action-list"><div class="action-item"><div class="action-name">Primary Capability</div><div class="action-desc">${card.attack}</div></div></div>`;
        }

        combatSection = `
            <div class="scholarly-section" style="background: rgba(0,0,0,0.1); padding: 2rem; border: 1px dashed rgba(193,154,107,0.2); border-radius: 4px;">
                <h3 style="margin-top:0;">Tactical Manifest (RPG Data)</h3>
                <p style="font-size:0.8rem; color:var(--accent); opacity:0.6; margin-bottom:1rem; font-family:monospace;">// ARCHIVE_SEC_LEVEL_4 // COMBAT_POTENTIAL_METRICS</p>
                ${statsHtml}
                ${actionsHtml}
                ${card.specialAbilities ? `<div style="margin-top:1.5rem;"><b style="color:var(--accent); font-family:'Cinzel', serif; font-size:0.8rem;">Special Traits:</b> <span style="font-size:0.9rem; color:rgba(243,233,220,0.7);">${card.specialAbilities.join(', ')}</span></div>` : ''}
                ${card.special ? `<div style="margin-top:1.5rem;"><b style="color:var(--accent); font-family:'Cinzel', serif; font-size:0.8rem;">Note:</b> <span style="font-size:0.9rem; color:rgba(243,233,220,0.7);">${card.special}</span></div>` : ''}
            </div>`;
    }

    let theologySection = '';
    if (card.theology) {
        theologySection = `
            <div class="scholarly-section">
                <h3>Primary Sources & Manuscripts</h3>
                <div class="manuscript-grid">
                    ${card.theology.biblical && card.theology.biblical.length > 0 ? 
                        card.theology.biblical.map(src => `<div class="manuscript-item"><b>Biblical:</b> ${src}</div>`).join('') : ''}
                    ${card.theology.extraBiblical && card.theology.extraBiblical.length > 0 ? 
                        card.theology.extraBiblical.map(src => `<div class="manuscript-item"><b>Extra-Biblical:</b> ${src}</div>`).join('') : ''}
                </div>
            </div>
        `;
    }

    let main = `
        <div class="modal-main">
            <div class="dossier-header">
                <div>
                    <h1 style="font-family:'Cinzel', serif; color:var(--accent); font-size:2.8rem; margin-bottom:0.2rem; line-height:1;">${card.name}</h1>
                    <div class="dossier-id">${card.id.toUpperCase()} // ARCHIVE_REF_${Math.floor(Math.random()*10000)}</div>
                </div>
                ${card.hebrew ? `<div style="font-size: 3.5rem; color: var(--accent); opacity:0.8; font-family:serif; line-height:1;">${card.hebrew}</div>` : ''}
            </div>
            
            <div class="scholarly-section" style="border-top:none; margin-top:0;">
                <h3>Executive Summary</h3>
                <p class="academic-text" style="font-size:1.2rem; border-left:4px solid var(--accent); padding-left:2rem; font-style:italic; color:var(--light); background: rgba(193,154,107,0.03); padding-top:1rem; padding-bottom:1rem;">${card.description}</p>
            </div>
            
            ${academicSection}
            ${combatSection}
            ${theologySection}
            
            <div style="margin-top:5rem; padding:2rem; background:rgba(193,154,107,0.05); border:1px solid rgba(193,154,107,0.1); border-radius:4px; font-size:0.8rem; color:rgba(243,233,220,0.4); text-align:center; font-family:monospace; letter-spacing:0.2em;">
                RESTRICTED ACCESS // SYNTHESIZED ARCHIVE // PROPERTY OF PROJECT NEPHILIM WARS
            </div>
        </div>`;
    
    content.innerHTML = sidebar + main; 
    overlay.classList.add('open');
}

// Event Listeners
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('open'));

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        applyFilters();
    });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    applyFilters();
});

loadData();
</script></body></html>
